</style></head><body><div class="layout world-layout"><main class="play-pane"><header class="headline"><div><h1>Экспедиция «Зелёный остров»</h1><p>Окружающий мир · исследование природы</p></div><span class="head-chip">🧭 Вы сами выбираете маршрут</span><button type="button" class="resetmini" aria-label="Начать игру заново" onclick="worldReset()">↻</button></header><section class="stage"><div class="map" id="world-map"><img src="board.webp" alt="Джунгли, мосты, водопады и древний храм"><div id="world-points"></div></div></section></main>
<aside class="side"><section class="panel"><h2 class="side-title">Журнал исследователя</h2><div class="statline"><span class="muted">Изучено мест</span><strong class="metric" id="world-count">0 / 6</strong></div><div class="meter"><i id="world-meter" style="width:0%"></i></div><div class="world-badges" id="world-badges"></div></section>
<section class="panel world-main"><div class="world-icon" id="world-icon">🧭</div><h2 class="side-title" id="world-place">Выберите место на карте</h2><p class="status" id="world-status" aria-live="polite">Нажмите на любую сверкающую точку. Исследователь отправится к ней.</p><button class="primary full" id="world-task" disabled>Исследовать место →</button></section>
<section class="panel"><h2 class="side-title">Собранные находки</h2><div id="world-log" class="world-log">Пока в рюкзаке ничего нет.</div></section>
<section class="panel world-bottom"><button class="secondary full" id="world-reset">↻ Новая экспедиция</button></section></aside></div>
<div class="overlay" id="activity-overlay"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="activity-title"><div class="dialog-label" id="activity-label">Испытание</div><h2 id="activity-title"></h2><div class="task-guide" id="activity-guide"></div><div class="task-options" id="activity-options"></div><div class="task-note" id="activity-note" aria-live="polite"></div><div class="dialog-actions" id="activity-actions"></div></div></div><script>// Shared task player: factual checks work offline. The task appears only after a user click.
class Activity {
  constructor(){this.overlay=document.querySelector('#activity-overlay');this.title=document.querySelector('#activity-title');this.label=document.querySelector('#activity-label');this.panel=document.querySelector('#activity-options');this.guide=document.querySelector('#activity-guide');this.note=document.querySelector('#activity-note');this.actions=document.querySelector('#activity-actions');this.chosen=[];this.answerText='';this.finished=false;this.task=null;this.callback=null;this.pairLeft=null;this.matched=new Set();}
  show(task,label,onDone){this.task=task;this.callback=onDone;this.chosen=[];this.answerText='';this.finished=false;this.pairLeft=null;this.matched=new Set();this.label.textContent=label||'Задание';this.title.textContent=task.q;this.overlay.classList.add('open');this.draw();}
  el(tag,klass,value){let e=document.createElement(tag);if(klass)e.className=klass;if(value!==undefined)e.textContent=value;return e;}
  clear(){this.panel.replaceChildren();this.actions.replaceChildren();this.note.textContent='';this.note.className='task-note';this.guide.textContent='';}
  button(parent,text,callback,style='primary'){let b=this.el('button',style,text);b.type='button';b.addEventListener('click',callback);parent.append(b);return b;}
  option(label,i,handler,selected=false){const b=this.el('button','opt'+(selected?' selected':''),label);b.type='button';b.disabled=this.finished;b.addEventListener('click',()=>handler(i));this.panel.append(b);return b;}
  draw(){this.clear();const t=this.task;if(this.finished)return;
    if(t.type==='choice'||t.type==='boolean'||t.type==='picture'){
      const opts=t.type==='boolean'?['Верно','Неверно']:t.options;
      opts.forEach((x,i)=>this.option(x,i,()=>{this.chosen=[i];this.draw()},this.chosen.includes(i)));
      this.button(this.actions,'Проверить ответ',()=>this.check());
    }else if(t.type==='multi'){
      this.guide.textContent=`Выберите ${t.answer.length} варианта`;
      t.options.forEach((x,i)=>this.option((this.chosen.includes(i)?'☑ ':'☐ ')+x,i,()=>{this.chosen=this.chosen.includes(i)?this.chosen.filter(a=>a!==i):[...this.chosen,i];this.draw();},this.chosen.includes(i)));
      this.button(this.actions,'Проверить',()=>this.check());
    }else if(t.type==='input'){
      const inp=this.el('input','task-entry');inp.type='text';inp.setAttribute('aria-label','Введите ответ');inp.placeholder=t.placeholder||'Введите ответ';inp.value=this.answerText;inp.addEventListener('input',v=>this.answerText=v.target.value);inp.addEventListener('keydown',e=>{if(e.key==='Enter')this.check()});this.panel.append(inp);this.panel.style.gridTemplateColumns='1fr';this.button(this.actions,'Проверить',()=>this.check());
    }else if(t.type==='order'){
      this.guide.textContent='Нажимайте карточки в нужной последовательности';const bar=this.el('div','task-picks',this.chosen.join(' → ')||'Пока ничего не выбрано');bar.style.gridColumn='1/-1';this.panel.append(bar);
      t.options.forEach((x,i)=>{let b=this.option(x,i,()=>{if(!this.chosen.includes(x)){this.chosen.push(x);this.draw();}},this.chosen.includes(x));b.disabled=this.chosen.includes(x)});
      this.button(this.actions,'Начать заново',()=>{this.chosen=[];this.draw()},'secondary');this.button(this.actions,'Проверить порядок',()=>this.check());
    }else if(t.type==='pairs'){
      this.guide.textContent=`Найдите пары: ${this.matched.size} из ${t.pairs.length}`;
      const a=this.el('div','task-picks');a.style.gridColumn='1/-1';a.textContent=this.pairLeft===null?'Выберите слово слева, затем его пару справа':`Выбрано: ${t.pairs[this.pairLeft][0]}`;this.panel.append(a);
      const left=this.el('div','task-pair-column');const right=this.el('div','task-pair-column');[left,right].forEach(c=>{c.style.display='grid';c.style.gap='8px';c.style.gridAutoRows='minmax(47px,auto)'});
      t.pairs.forEach((p,i)=>{let b=this.el('button','opt'+(this.pairLeft===i?' selected':''),p[0]);b.disabled=this.matched.has(i);b.onclick=()=>{this.pairLeft=i;this.draw();};left.append(b)});
      const indices=t.pairs.map((_,i)=>i).reverse();indices.forEach(i=>{const b=this.el('button','opt',t.pairs[i][1]);b.disabled=this.matched.has(i);b.onclick=()=>{if(this.pairLeft===null){this.note.textContent='Сначала выберите левую карточку';return}if(this.pairLeft===i){this.matched.add(i);this.pairLeft=null;if(this.matched.size===t.pairs.length){this.grade(true);return}this.draw()}else{this.pairLeft=null;this.draw();this.note.textContent='Не совпало — попробуйте ещё раз.'}};right.append(b)});
      this.panel.append(left,right);this.button(this.actions,'Сбросить пары',()=>{this.matched.clear();this.pairLeft=null;this.draw()},'secondary');
    }
    if(t.type!=='input')this.panel.style.gridTemplateColumns='1fr 1fr';
  }
  check(){if(this.finished)return;const t=this.task;let ok=false;const a=this.chosen;
    if(['choice','picture','boolean'].includes(t.type)){if(!a.length){this.note.textContent='Сначала выберите ответ';return}ok=a[0]===t.answer;}
    if(t.type==='multi'){if(a.length!==t.answer.length){this.note.textContent=`Выберите ${t.answer.length} варианта`;return}ok=[...a].sort((x,y)=>x-y).join(',')===[...t.answer].sort((x,y)=>x-y).join(',')}
    if(t.type==='order'){if(a.length!==t.answer.length){this.note.textContent='Выберите все карточки';return}ok=JSON.stringify(a)===JSON.stringify(t.answer)}
    if(t.type==='input'){const normalize=s=>String(s).toLocaleLowerCase('ru').trim().replace(/\s+/g,' ');if(!normalize(this.answerText)){this.note.textContent='Введите ответ';return}ok=t.answers.some(x=>normalize(x)===normalize(this.answerText))}
    this.grade(ok);
  }
  grade(correct){this.finished=true;this.panel.querySelectorAll('button,input').forEach(b=>b.disabled=true);this.note.textContent=(correct?'✓ Правильно! ':'Ответ пока неверный. ')+(this.task.why||'');this.note.className='task-note '+(correct?'good':'bad');this.actions.replaceChildren();this.button(this.actions,'Продолжить игру →',()=>{this.overlay.classList.remove('open');this.callback(correct)});}
}
const activity=new Activity();
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function locate(el,pos){el.style.left=pos[0]+'%';el.style.top=pos[1]+'%'}
function tokenInto(map,image,cls=''){const t=document.createElement('div');t.className='token '+cls;const i=document.createElement('img');i.src=image;i.alt='Фишка';t.append(i);map.append(t);return t;}

const WORLD_SITES=[
 {name:'Большой водопад',icon:'💧',x:22,y:34,prize:'Капля воды',task:{type:'boolean',q:'Верно ли, что вода в природе может существовать в трёх состояниях?',answer:0,why:'Вода бывает твёрдой (лёд), жидкой и газообразной (пар).'}},
 {name:'Подвесной мост',icon:'🌿',x:41,y:51,prize:'Лист путешественника',task:{type:'order',q:'Расположите простую пищевую цепь в правильном порядке.',options:['🐸 Лягушка','🌱 Растение','🦗 Кузнечик'],answer:['🌱 Растение','🦗 Кузнечик','🐸 Лягушка'],why:'Кузнечик питается растениями, лягушка — насекомыми.'}},
 {name:'Пещера',icon:'🪨',x:67,y:24,prize:'Кусочек горной породы',task:{type:'choice',q:'Что относится к неживой природе?',options:['🍄 Гриб','🪨 Камень','🌳 Дерево','🦋 Бабочка'],answer:1,why:'Камень относится к неживой природе.'}},
 {name:'Слоновья поляна',icon:'🐘',x:69,y:58,prize:'След животного',task:{type:'multi',q:'Выберите двух млекопитающих.',options:['🐘 Слон','🐊 Крокодил','🐯 Тигр','🦋 Бабочка'],answer:[0,2],why:'Слон и тигр выкармливают детёнышей молоком.'}},
 {name:'Солнечный храм',icon:'☀️',x:88,y:17,prize:'Солнечный амулет',task:{type:'pairs',q:'Соедините части растения с их основной функцией.',pairs:[['Корни','поглощение воды'],['Листья','фотосинтез']],why:'Корни поглощают воду, а в листьях происходит фотосинтез.'}},
 {name:'Клад искателя',icon:'💎',x:88,y:77,prize:'Кристалл экспедиции',task:{type:'input',q:'На какой планете мы живём? Введите её название.',answers:['земля','планета земля'],why:'Наша планета — Земля.'}}
];
let worldVisited=new Set(),worldSelected=-1,worldState='choose',worldPosition=[9,80];const worldMap=document.querySelector('#world-map');
const worldAvatar=tokenInto(worldMap,'tiger.png','world-avatar');locate(worldAvatar,worldPosition);
function worldMessage(t){document.querySelector('#world-status').textContent=t}
async function worldSelect(i){if(worldState==='walking'||worldState==='task'||worldVisited.has(i))return;worldState='walking';worldSelected=i;worldUpdate();worldMessage('Исследователь идёт к месту «'+WORLD_SITES[i].name+'». Следите за перемещением по карте…');await wait(90);const site=WORLD_SITES[i];worldPosition=[site.x,site.y];locate(worldAvatar,worldPosition);await wait(1750);worldState='ready';worldUpdate();worldMessage('Исследователь прибыл! Посмотрите, где он остановился. Когда будете готовы, нажмите «Исследовать место».');}
function worldStartTask(){if(worldState!=='ready'||worldSelected<0)return;worldState='task';const i=worldSelected;worldUpdate();activity.show(WORLD_SITES[i].task,WORLD_SITES[i].name,ok=>{worldState='choose';if(ok){worldVisited.add(i);worldMessage('✅ Находка «'+WORLD_SITES[i].prize+'» в рюкзаке. Выбирайте другое место.');}else worldMessage('Эту находку ещё не удалось получить. Попробуйте вернуться к месту.');worldSelected=-1;worldUpdate();});}
function worldUpdate(){const host=document.querySelector('#world-points');host.replaceChildren();WORLD_SITES.forEach((s,i)=>{const b=document.createElement('button');b.className='glowpoint world-marker '+(worldVisited.has(i)?'done':i===worldSelected?'current':'');b.textContent=worldVisited.has(i)?'✓':s.icon;b.title=s.name;b.setAttribute('aria-label','Отправиться к месту: '+s.name);b.style.left=s.x+'%';b.style.top=s.y+'%';b.disabled=worldState==='walking'||worldState==='task';b.onclick=()=>worldSelect(i);host.append(b)});document.querySelector('#world-count').textContent=worldVisited.size+' / 6';document.querySelector('#world-meter').style.width=(worldVisited.size/6*100)+'%';document.querySelector('#world-badges').innerHTML=WORLD_SITES.map((s,i)=>`<span class="${worldVisited.has(i)?'done':''}" title="${s.name}">${worldVisited.has(i)?s.icon:'◈'}</span>`).join('');document.querySelector('#world-place').textContent=worldSelected<0?worldVisited.size===6?'Экспедиция завершена!':'Выберите место на карте':WORLD_SITES[worldSelected].name;document.querySelector('#world-icon').textContent=worldSelected<0?worldVisited.size===6?'🏆':'🧭':WORLD_SITES[worldSelected].icon;document.querySelector('#world-task').disabled=worldState!=='ready';document.querySelector('#world-log').innerHTML=worldVisited.size?WORLD_SITES.filter((s,i)=>worldVisited.has(i)).map(s=>`<div>✓ ${s.prize}</div>`).join(''):'Пока в рюкзаке ничего нет.';}
function worldReset(){worldVisited=new Set();worldSelected=-1;worldState='choose';worldPosition=[9,80];locate(worldAvatar,worldPosition);worldMessage('Нажмите на любую сверкающую точку. Исследователь отправится к ней.');worldUpdate();}
document.querySelector('#world-task').addEventListener('click',worldStartTask);document.querySelector('#world-reset').addEventListener('click',worldReset);worldReset();
</script></body></html>
